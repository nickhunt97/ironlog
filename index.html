/* ------------------------------------------------------------------
   Storage adapter: talks to the Apps Script JSON API over fetch.
   POST + text/plain avoids a CORS preflight, which Apps Script
   cannot answer. Exposes the same {get,set} shape the app expects.
   ------------------------------------------------------------------ */
(function () {
  var LS = 'ironlog:conn';
  var conn = null;
  try { conn = JSON.parse(localStorage.getItem(LS) || 'null'); } catch (e) {}
  var cache = {}, ready = false;

  function api(action, payload) {
    var body = Object.assign({ token: conn.token, action: action }, payload || {});
    return fetch(conn.url, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(body),
      redirect: 'follow'

      .then(function (j) {
        if (!j.ok) throw new Error(j.error || 'Request failed');
        return j.data;
      });
  }

  window.IronLogStore = {
    get: function (key) {
      if (ready && key in cache) return Promise.resolve({ key: key, value: cache[key] });
      return api('get', { key: key }).then(function (v) {
        cache[key] = v === null ? null : JSON.stringify(v);
        return { key: key, value: cache[key] };
      });
    },
    set: function (key, value) {
      cache[key] = value;
      return api('save', { key: key, value: value }).then(function () {
        return { key: key, value: value };
      });
    }
  };

  function registerSW() {
    try {
      if (navigator.serviceWorker && typeof navigator.serviceWorker.register === 'function') {
        navigator.serviceWorker.register('sw.js').catch(function () {});
      }

  var mounted = false;
  function mount() {
    if (mounted) return;
    var el = document.getElementById('root');
    el.innerHTML = '';
    mounted = true;
    window.__IronLogMount(el);
    registerSW();
  }

  function load() {
    document.getElementById('boot').innerHTML =
      '<div class="in"><h1><b>IRON</b>LOG</h1><div class="spin">Loading your log…</div></div>';
    return api('loadAll').then(function (d) {
      cache['gym:sessions'] = JSON.stringify(d.sessions || []);
      cache['gym:custom']   = JSON.stringify(d.custom || []);
      cache['gym:settings'] = d.settings ? JSON.stringify(d.settings) : null;
      cache['gym:active']   = d.active ? JSON.stringify(d.active) : null;
      ready = true;
      try { localStorage.setItem('ironlog:cache', JSON.stringify(cache)); } catch (e) {}
      mount();
    });
  }

  function offlineFallback(err) {
    if (mounted) { console.error('IronLog:', err); return; }
    var raw = null;
    try { raw = JSON.parse(localStorage.getItem('ironlog:cache') || 'null'); } catch (e) {}
    if (raw) { cache = raw; ready = true; mount(); return; }
    setupScreen('Could not reach your sheet: ' + (err && err.message || err));
  }

  function setupScreen(err) {
    var b = document.getElementById('boot');
    if (!b) {
      var root = document.getElementById('root');
      root.innerHTML = '<div id="boot"></div>';
      b = document.getElementById('boot');
    }
    b.innerHTML =
      '<div class="in"><h1><b>IRON</b>LOG</h1>' +
      '<p>One-time setup. Paste the web app URL and token from your Apps Script project.</p>' +
      '<label for="u">Apps Script web app URL</label>' +
      '<input id="u" placeholder="https://script.google.com/macros/s/…/exec" autocapitalize="off" autocorrect="off" spellcheck="false">' +
      '<label for="t">API token</label>' +
      '<input id="t" placeholder="paste the token from setupToken()" autocapitalize="off" autocorrect="off" spellcheck="false">' +
      '<button id="go">Connect</button>' +
      '<div class="err">' + (err || '') + '</div>' +
      '<div class="muted">Stored on this device only.</div></div>';
    if (conn) { b.querySelector('#u').value = conn.url || ''; b.querySelector('#t').value = conn.token || ''; }
    var btn = b.querySelector('#go');
    btn.onclick = function () {
      var url = b.querySelector('#u').value.trim();
      var tok = b.querySelector('#t').value.trim();
      if (!/^https:\/\/script\.google\.com\/macros\/s\/.+\/exec$/.test(url)) {
        b.querySelector('.err').textContent = 'That does not look like a /exec web app URL.'; return;
      }
      if (!tok) { b.querySelector('.err').textContent = 'Paste the token.'; return; }
      conn = { url: url, token: tok };
      btn.disabled = true; btn.textContent = 'Connecting…';
      b.querySelector('.err').textContent = '';
      api('ping').then(function () {
        localStorage.setItem(LS, JSON.stringify(conn));
        return load();
      }).catch(function (e) {
        if (mounted) { console.error('IronLog:', e); return; }

  }

  window.IronLogReset = function () { localStorage.removeItem(LS); location.reload(); };

})();
</script>
