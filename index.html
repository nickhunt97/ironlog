<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="IronLog">
<title>IronLog</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32">
<style>
  html,body{margin:0;padding:0;background:#000;height:100%;overflow:hidden;
    font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#F2F0EC}
  #frame{position:fixed;inset:0;width:100%;height:100%;border:0;background:#000;
    padding-top:env(safe-area-inset-top,0px);box-sizing:border-box}
  #setup{position:fixed;inset:0;display:grid;place-items:center;padding:28px;
    padding-top:calc(28px + env(safe-area-inset-top,0px));text-align:center;overflow:auto}
  .in{max-width:400px;width:100%}
  h1{font:600 30px/1 system-ui;letter-spacing:.06em;text-transform:uppercase;margin:0 0 6px}
  h1 b{color:#E11D2E}
  p{color:#9A9690;font-size:14px;line-height:1.55;margin:0 0 18px}
  label{display:block;text-align:left;font:500 10px/1 ui-monospace,monospace;letter-spacing:.16em;
    text-transform:uppercase;color:#6B6762;margin:14px 0 6px}
  input{width:100%;box-sizing:border-box;background:#151518;border:1px solid #26262A;border-radius:8px;
    padding:11px 12px;color:#F2F0EC;font:400 15px ui-monospace,monospace}
  input:focus{outline:2px solid #E11D2E;outline-offset:-1px}
  button{width:100%;margin-top:18px;background:#E11D2E;color:#fff;border:0;border-radius:10px;
    padding:13px;font:600 16px system-ui;letter-spacing:.05em;text-transform:uppercase}
  .err{color:#E11D2E;font-size:13px;margin-top:12px;min-height:18px}
  .muted{color:#6B6762;font-size:12px;margin-top:16px;line-height:1.5}
  .muted a{color:#D4A127}
  #spin{position:fixed;inset:0;display:grid;place-items:center;background:#000;
    color:#6B6762;font:500 12px ui-monospace,monospace;letter-spacing:.16em;text-transform:uppercase}
</style>
</head>
<body>
<div id="app"></div>
<script>
(function(){
  var LS='ironlog:url';
  var url=null;
  try{ url=localStorage.getItem(LS); }catch(e){}
  var app=document.getElementById('app');

  function reset(){ try{localStorage.removeItem(LS);}catch(e){} location.reload(); }
  window.IronLogReset=reset;

  function launch(u){
    app.innerHTML='<div id="spin">Loading your log…</div>'+
      '<iframe id="frame" src="'+u+'" allow="clipboard-write" '+
      'referrerpolicy="no-referrer-when-downgrade"></iframe>';
    var f=document.getElementById('frame'), spin=document.getElementById('spin');
    var done=false;
    f.onload=function(){ done=true; if(spin) spin.remove(); };
    setTimeout(function(){
      if(!done && spin) spin.textContent='Still loading — check your connection';
    },12000);
    if('serviceWorker' in navigator){
      try{ navigator.serviceWorker.register('sw.js').catch(function(){}); }catch(e){}
    }
  }

  function setup(err){
    app.innerHTML=
      '<div id="setup"><div class="in">'+
      '<h1><b>IRON</b>LOG</h1>'+
      '<p>One-time setup. Paste your Apps Script web app URL — the same one that already works in your browser.</p>'+
      '<label for="u">Web app /exec URL</label>'+
      '<input id="u" placeholder="https://script.google.com/macros/s/…/exec" '+
      'autocapitalize="off" autocorrect="off" spellcheck="false">'+
      '<button id="go">Launch</button>'+
      '<div class="err">'+(err||'')+'</div>'+
      '<div class="muted">Stored on this device only. No token needed — '+
      'the app signs in with your Google account, exactly as it does in the browser.</div>'+
      '</div></div>';
    var i=document.getElementById('u');
    if(url) i.value=url;
    document.getElementById('go').onclick=function(){
      var v=i.value.trim();
      if(!/^https:\/\/script\.google\.com\/macros\/(u\/\d+\/)?s\/.+\/exec/.test(v)){
        document.querySelector('.err').textContent='That should end in /exec — copy it from Manage deployments.';
        return;
      }
      try{ localStorage.setItem(LS,v); }catch(e){}
      launch(v);
    };
  }

  if(location.search.indexOf('setup')>=0) setup('');
  else if(url) launch(url);
  else setup('');
})();
</script>
</body>
</html>
